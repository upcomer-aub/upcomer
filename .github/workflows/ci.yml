# Continuous integration (US-95): every push to main and every pull request to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      # US-93: grouping and ranking accuracy on the committed evaluation set; fails if it drops below the baseline.
      - run: npm run eval:grouping
      - run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A throwaway database that exists only for this run; never the team's hosted database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: upcomer_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/upcomer_ci?schema=public
      FILE_STORAGE_ROOT: public/uploads
      # Test-only admin for the seed and the admin e2e tests; the database is discarded after every run.
      ADMIN_EMAIL: ci-admin@mail.aub.edu
      ADMIN_PASSWORD: ci-only-password
      # The server under test builds password reset links from this address (US-03).
      APP_URL: http://127.0.0.1:3000
      # Makes Playwright build and start a fresh server instead of reusing one, and turns on the HTML report.
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      # Integration tests (US-74, US-92) against this run's database.
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
